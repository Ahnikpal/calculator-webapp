<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator with Num Lock</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #fff;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .calc-container {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        width: 320px;
      }

      .calc-display {
        background: #888;
        color: #fff;
        height: 100px;
        border-radius: 8px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 10px 15px;
        font-size: 2rem;
        margin-bottom: 20px;
        overflow: hidden;
      }

      .calc-btn {
        width: 100%;
        height: 60px;
        font-size: 1.2rem;
        font-weight: bold;
        background: #f8f9fa;
        border: none;
        border-radius: 8px;
        color: #333;
        transition: all 0.2s;
      }

      .calc-btn:hover {
        background: #e2e6ea;
      }

      .calc-btn:active {
        transform: scale(0.98);
      }

      .calc-btn.operator {
        background: #d1e7dd;
        color: #0f5132;
      }

      .calc-btn.equals {
        background: #f8d7da;
        color: #842029;
      }

      .calc-btn.disabled {
        background: #eee !important;
        color: #aaa !important;
        cursor: not-allowed;
      }

      .calc-btn.numlock-on {
        background: #d1e7dd;
        color: #0f5132;
      }

      @media (max-width: 400px) {
        .calc-container {
          width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <div class="calc-container">
      <!-- Display -->
      <div class="calc-display" id="display">0</div>

      <!-- Buttons -->
      <div class="row g-3">
        <div class="col-3">
          <button class="btn calc-btn" id="numLockBtn">Num<br />Lock</button>
        </div>
        <div class="col-3">
          <button class="btn calc-btn" data-key="CE">CE</button>
        </div>
        <div class="col-3">
          <button class="btn calc-btn" data-key="Del">Del</button>
        </div>
        <div class="col-3">
          <button class="btn calc-btn operator" data-key="/">/</button>
        </div>

        <div class="col-3"><button class="btn calc-btn number" data-key="7">7</button></div>
        <div class="col-3"><button class="btn calc-btn number" data-key="8">8</button></div>
        <div class="col-3"><button class="btn calc-btn number" data-key="9">9</button></div>
        <div class="col-3"><button class="btn calc-btn operator" data-key="*">x</button></div>

        <div class="col-3"><button class="btn calc-btn number" data-key="4">4</button></div>
        <div class="col-3"><button class="btn calc-btn number" data-key="5">5</button></div>
        <div class="col-3"><button class="btn calc-btn number" data-key="6">6</button></div>
        <div class="col-3"><button class="btn calc-btn operator" data-key="-">-</button></div>

        <div class="col-3"><button class="btn calc-btn number" data-key="1">1</button></div>
        <div class="col-3"><button class="btn calc-btn number" data-key="2">2</button></div>
        <div class="col-3"><button class="btn calc-btn number" data-key="3">3</button></div>
        <div class="col-3"><button class="btn calc-btn operator" data-key="+">+</button></div>

        <div class="col-6">
          <button class="btn calc-btn number" data-key="0">0</button>
        </div>
        <div class="col-3">
          <button class="btn calc-btn number" data-key=".">.</button>
        </div>
        <div class="col-3">
          <button class="btn calc-btn equals" data-key="=">=</button>
        </div>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");
      let currentInput = "";
      let numLockOn = true;

      const updateNumLock = () => {
        const numLockBtn = document.getElementById("numLockBtn");
        const numberBtns = document.querySelectorAll(".calc-btn.number");

        numberBtns.forEach((btn) => {
          btn.disabled = !numLockOn;
          btn.classList.toggle("disabled", !numLockOn);
        });

        numLockBtn.classList.toggle("numlock-on", numLockOn);
      };

      document.getElementById("numLockBtn").addEventListener("click", () => {
        numLockOn = !numLockOn;
        updateNumLock();
      });

      document.querySelectorAll(".calc-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.key;
          if (!key || button.disabled) return;

          if (key === "=") {
            try {
              currentInput = eval(currentInput).toString();
              display.innerText = currentInput;
            } catch {
              display.innerText = "Error";
              currentInput = "";
            }
          } else if (key === "CE") {
            currentInput = "";
            display.innerText = "0";
          } else if (key === "Del") {
            currentInput = currentInput.slice(0, -1);
            display.innerText = currentInput || "0";
          } else {
            currentInput += key;
            display.innerText = currentInput;
          }
        });
      });

      // 🔄 Initialize on load
      updateNumLock();
    </script>
  </body>
</html>
